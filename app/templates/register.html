{% extends "base.html" %}

{% block content %}
<div class="login-wrapper">
    <div class="login-container">
        <div class="login-box">
            <h2 class="text-center mb-4 text-dark-green fw-bold">Register</h2>
            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="input-group mb-3">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="username" required>
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                    <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="email" required>
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="password" required>
                </div>
                <button type="submit" class="btn btn-dark-green w-100 rounded-pill py-2 fw-semibold">Register</button>
                
                <div class="text-center mt-4 text-muted small">
                    Already have an account? <a href="{{ url_for('auth.login') }}" class="text-dark-green text-decoration-underline">Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
